[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventbook"
version = "0.1.0"
description = "Local-first binary event-market L2 replay research engine"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "PyYAML>=6.0", "polars>=1.0", "pyarrow>=16"]

[project.optional-dependencies]
data = []
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
